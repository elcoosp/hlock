[package]
name = "hlock"
version = "0.19.0"
edition = "2024"

[dependencies]
thiserror = "2.0.21"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
blake3 = "1.8.7"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
fips204 = { version = "0.5.0", features = ["ml-dsa-65", "default-rng"] }
clap = { version = "4.6.7", features = ["derive"] }
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
clap_complete = "4.6.11"
reqwest = { version = "0.13.5", features = ["json", "rustls", "blocking"], default-features = false }
toml = "1.1.8"
getrandom = "0.4"

[[bin]]
name = "hlock"
path = "src/main.rs"

[lib]
name = "hlock"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
