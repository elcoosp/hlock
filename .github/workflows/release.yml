name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  changelog:
    name: Changelog (git-cliff)
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history required for git-cliff
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate release notes for this tag
        id: cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --latest --strip all > release-notes.md
          cat release-notes.md
          {
            echo 'content<<EOF'
            cat release-notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Regenerate full CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git-cliff --output CHANGELOG.md
      - uses: actions/upload-artifact@v7
        with:
          name: CHANGELOG.md
          path: CHANGELOG.md

  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: hlock-x86_64-linux.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: hlock-x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: hlock-aarch64-macos.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: hlock-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/hlock" stage/
          cp README.md CHANGELOG.md LICENSE* stage/ 2>/dev/null || cp README.md stage/
          tar czf "${{ matrix.archive }}" -C stage .
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/hlock.exe" stage/
          Copy-Item README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [changelog, build-release]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.changelog.outputs.notes }}
          files: |
            dist/hlock-*
          fail_on_unmatched_files: true

  # Optional: publish the library to crates.io. Requires the
  # CARGO_REGISTRY_TOKEN repository secret; skipped when it is absent.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"
            exit 0
          fi
          cargo publish
